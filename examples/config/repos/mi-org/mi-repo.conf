# Ejemplo con valores ficticios. Copiar a:
#   ${XDG_CONFIG_HOME:-$HOME/.config}/th-worktools/repos/<owner>/<repo>.conf
#
# Una línea por entrada: "link <ruta>". La ruta es relativa al repo, existe en
# el checkout principal y debe estar ignorada por git (sin "/" final, ".." ni globs).
# "new" y "checkout" crean un symlink a ella en el worktree; "pr" no aplica este archivo.
link .wiki
link .env
link docs/local

# Si la ruta es un directorio, ignórala SIN barra final (".wiki", no ".wiki/") en
# el .gitignore o en .git/info/exclude: para git un symlink es un archivo y
# ".wiki/" no lo cubre.

# Opcional: prefijo del comando de instalación de dependencias (una sola palabra).
# Debe ser un ejecutable del PATH, no una función ni un alias de zsh (th-wt corre en
# bash no interactivo y no los ve), sin "/". Con pnpm-lock.yaml ejecuta
# "with-token pnpm install --frozen-lockfile"; con package-lock.json, "with-token npm ci".
# deps-prefix with-token
