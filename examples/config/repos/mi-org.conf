# Ejemplo con valores ficticios. Copiar a:
#   ${XDG_CONFIG_HOME:-$HOME/.config}/th-worktools/repos/<owner>.conf
#
# Reglas comunes a todos los repos de la organización <owner>. Mismo formato que
# repos/<owner>/<repo>.conf, que se lee después y reemplaza una misma ruta.
# "link? <ruta>" es como "link", pero si la ruta no existe en el checkout principal
# o si la rama la versiona, se omite sin error: sirve para rutas que solo algunos repos tienen.
link? .wiki
link? .openspec

# Ramas de larga vida que "close" conserva en todos los repos de la organización.
keep develop
