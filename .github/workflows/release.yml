name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  # release-please creates and moves the "autorelease: pending/tagged" labels.
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
